name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Get changed files
        id: changes
        run: |
          git fetch origin main --depth=1
          FDELIM=$(openssl rand -hex 8)
          {
            echo "files<<$FDELIM"
            git diff --name-only origin/main | grep -Ev 'package-lock\.json|\.db$|\.db-wal$|\.db-shm$|\.log$|^public/dist/'
            echo "$FDELIM"
          } >> $GITHUB_OUTPUT
      - name: Get inline comment context
        id: comment
        if: (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) && github.event_name == 'pull_request_review_comment'
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          DIFF_HUNK: ${{ github.event.comment.diff_hunk }}
          FILE_PATH: ${{ github.event.comment.path }}
          LINE: ${{ github.event.comment.line }}
        run: |
          echo "comment_id=$COMMENT_ID" >> $GITHUB_OUTPUT
          echo "comment_body=$COMMENT_BODY" >> $GITHUB_OUTPUT
          echo "comment_html_url=$COMMENT_URL" >> $GITHUB_OUTPUT
          # Write diff_hunk to file to avoid shell interpolation issues
          printf '%s' "$DIFF_HUNK" > /tmp/diff_hunk.txt
          echo "diff_hunk_file=/tmp/diff_hunk.txt" >> $GITHUB_OUTPUT
          echo "file_path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "line=$LINE" >> $GITHUB_OUTPUT
      - name: Get diff for review
        id: diff
        run: |
          set -e
          git fetch origin main --depth=1
          git diff -U3 origin/main -- . ":!package-lock.json" ":!*.db" ":!*.db-wal" ":!*.db-shm" ":!*.log" ":!public/dist/" > /tmp/diff_raw.txt || true
          node -e '
            const fs = require("fs");
            const CAP = 60 * 1024;
            let raw = fs.readFileSync("/tmp/diff_raw.txt", "utf8");
            if (Buffer.byteLength(raw, "utf8") <= CAP) { fs.writeFileSync("/tmp/diff_capped.txt", raw); return; }
            let cut = Buffer.from(raw, "utf8").slice(0, CAP).toString("utf8");
            const lastHunk = cut.lastIndexOf("\ndiff --git ");
            const lastHeader = cut.lastIndexOf("\n@@ ");
            const boundary = Math.max(lastHunk, lastHeader);
            cut = boundary > 0 ? cut.slice(0, boundary) : cut;
            const omitted = Buffer.byteLength(raw, "utf8") - Buffer.byteLength(cut, "utf8");
            fs.writeFileSync("/tmp/diff_capped.txt", cut + `\n[DIFF TRUNCATED — ${omitted} bytes omitted; review only the shown hunks]`);
          '
          if [ ! -s /tmp/diff_capped.txt ]; then
            echo "[NO TEXT DIFF — report nothing, VERDICT: Approved]" > /tmp/diff_capped.txt
          fi
          echo "diff_size=$(wc -c < /tmp/diff_capped.txt) bytes"
      - name: Build review prompt
        id: prompt
        env:
          FILES: ${{ steps.changes.outputs.files }}
          COMMENT_ID: ${{ steps.comment.outputs.comment_id }}
          FILE_PATH: ${{ steps.comment.outputs.file_path }}
          LINE: ${{ steps.comment.outputs.line }}
          COMMENT_BODY: ${{ steps.comment.outputs.comment_body }}
          DIFF_HUNK_FILE: ${{ steps.comment.outputs.diff_hunk_file }}
          GENERAL_BODY: ${{ github.event.comment.body }}
          DIFF_FILE: /tmp/diff_capped.txt
        run: |
          set -e
          if [ ! -f .github/prompts/code-review.md ]; then
            echo "Error: .github/prompts/code-review.md not found"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            let prompt = fs.readFileSync(".github/prompts/code-review.md", "utf8");
            let discussion = "";
            
            if (process.env.DIFF_HUNK_FILE && fs.existsSync(process.env.DIFF_HUNK_FILE)) {
              const diffHunk = fs.readFileSync(process.env.DIFF_HUNK_FILE, "utf8");
              discussion = `DISCUSSION_CONTEXT: Comment #${process.env.COMMENT_ID} at File: ${process.env.FILE_PATH} Line: ${process.env.LINE}\nDIFF_HUNK: ${diffHunk}\nUSER_SAID: ${process.env.COMMENT_BODY}`;
            }
            if (!discussion && process.env.GENERAL_BODY) {
              discussion = `DISCUSSION_CONTEXT: general PR comment (no line anchor)\nUSER_SAID: ${process.env.GENERAL_BODY}`;
            }
            
            const instruction = "THREAD_INSTRUCTION: Answer the users question in the thread concisely. Reference file, line and diff_hunk. Do not output VERDICT, STATS or full review table. Be focused, mention constraints if relevant.";
            const diffBody = fs.existsSync(process.env.DIFF_FILE) ? fs.readFileSync(process.env.DIFF_FILE, "utf8") : "[NO TEXT DIFF — report nothing, VERDICT: Approved]";
            const hasLine = process.env.FILE_PATH && process.env.LINE;
            const source = hasLine ? `inline:${process.env.FILE_PATH}:${process.env.LINE}` : `general`;
            prompt = prompt.replace(/\{files\}/g, () => process.env.FILES || "");
            prompt = prompt.replace(/\{diff\}/g, () => diffBody);
            prompt = prompt.replace(/\{comment_source\}/g, () => source);
            prompt = prompt.replace(/\{discussion_context\}/g, () => discussion);
            prompt = prompt.replace(/\{review_instruction\}/g, () => instruction);
            
            fs.writeFileSync("/tmp/final_prompt.md", prompt);
          '

          EOF_DELIM=$(openssl rand -hex 8)
          echo "prompt<<$EOF_DELIM" >> $GITHUB_OUTPUT
          cat /tmp/final_prompt.md >> $GITHUB_OUTPUT
          echo "$EOF_DELIM" >> $GITHUB_OUTPUT
      - name: Run OpenCode Thread Reply (principal)
        id: thread_principal
        # Pin to reviewed commit for v1.18.31 (mutable tags are supply-chain risk)
        uses: anomalyco/opencode/github@014614d35b397775e5d397a490fc72368c894ec2
        continue-on-error: true
        env:
          ZENCODE_API_KEY: ${{ secrets.ZENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PERMISSION: '{"*":"allow"}'
        with:
          model: ${{ vars.OPENCODE_SMALL_PRINCIPAL || 'opencode/nemotron-3.5-lightning-free' }}
          share: false
          use_github_token: true
          prompt: ${{ steps.prompt.outputs.prompt }}
      - name: Run OpenCode Thread Reply (fallback)
        id: thread_fallback
        if: steps.thread_principal.outcome == 'failure'
        # Same pin as principal; only the model input changes
        uses: anomalyco/opencode/github@014614d35b397775e5d397a490fc72368c894ec2
        env:
          ZENCODE_API_KEY: ${{ secrets.ZENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PERMISSION: '{"*":"allow"}'
          OPENCODE_MODEL_ATTEMPT: fallback
        with:
          model: ${{ vars.OPENCODE_SMALL_FALLBACK || 'opencode/big-pickle' }}
          share: false
          use_github_token: true
          prompt: ${{ steps.prompt.outputs.prompt }}
      - name: Reply in thread
        if: github.event_name == 'pull_request_review_comment' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "Reply in thread for comment $TRIGGER_COMMENT_ID on PR $PR_NUMBER run $RUN_ID"
          if [ -z "$TRIGGER_COMMENT_ID" ] || [ -z "$PR_NUMBER" ]; then
            echo "Missing TRIGGER_COMMENT_ID or PR_NUMBER, skipping"
            exit 0
          fi
          # Wait briefly for the main comment to appear (GH eventual consistency)
          BODY=""
          for i in 1 2 3 4 5 6; do
            BODY=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate 2>/dev/null | jq -r --arg run "$RUN_ID" 'first(.[] | select(.user.login == "github-actions[bot]" and (.body | contains($run))) | .body) // empty')
            if [ -n "$BODY" ] && [ "$BODY" != "null" ]; then
              echo "Found main comment on attempt $i"
              break
            fi
            echo "Main comment not found yet, retry $i/6..."
            sleep 4
          done
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "No main comment found for run $RUN_ID, skipping thread reply to avoid log fallback (thread needs focused answer, not log)"
            exit 0
          fi
          printf '%s' "$BODY" > /tmp/reply_body.txt
          echo "Reply body size: $(wc -c < /tmp/reply_body.txt) bytes"
          # Build JSON payload safely via node to handle special chars
          node -e '
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/reply_body.txt", "utf8");
            const payload = { body, in_reply_to: parseInt(process.env.TRIGGER_COMMENT_ID, 10) };
            fs.writeFileSync("/tmp/payload.json", JSON.stringify(payload));
          '
          echo "Posting reply to PR $PR_NUMBER in_reply_to $TRIGGER_COMMENT_ID"
          if gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --method POST --input /tmp/payload.json --silent; then
            echo "✓ Replied in thread via pulls/comments"
          else
            echo "⚠ Primary reply failed, trying alternative endpoint"
            node -e '
              const fs = require("fs");
              const body = fs.readFileSync("/tmp/reply_body.txt", "utf8");
              fs.writeFileSync("/tmp/payload2.json", JSON.stringify({ body }));
            '
            gh api "repos/$REPO/pulls/comments/$TRIGGER_COMMENT_ID/replies" --method POST --input /tmp/payload2.json --silent && echo "✓ Replied via replies endpoint" || echo "✗ Both reply attempts failed"
          fi
      # Artifacts are manual-recovery + same-run /tmp reuse; cross-run restore via run-page download (no auto-download).
      - name: Save thread state artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 (same pin as coverage upload)
        with:
          name: thread-state-${{ github.run_id }}
          path: |
            /tmp/reply_body.txt
            /tmp/final_prompt.md
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup general after thread reply
        if: github.event_name == 'pull_request_review_comment' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "Cleaning up general comment for thread run $RUN_ID (thread-only)"
          GENERAL_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate 2>/dev/null | jq -r --arg run "$RUN_ID" 'first(.[] | select(.user.login == "github-actions[bot]" and (.body | contains($run))) | .id) // empty')
          if [ -n "$GENERAL_ID" ] && [ "$GENERAL_ID" != "null" ]; then
            echo "Deleting general $GENERAL_ID (thread reply already posted)"
            gh api "repos/$REPO/issues/comments/$GENERAL_ID" --method DELETE 2>&1 | head -n 20 && echo "✓ Deleted general $GENERAL_ID" || echo "⚠ Failed to delete general $GENERAL_ID"
          else
            echo "No general found for $RUN_ID, nothing to delete"
          fi

  opencode-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Get changed files
        id: changes
        run: |
          git fetch origin main --depth=1
          FDELIM=$(openssl rand -hex 8)
          {
            echo "files<<$FDELIM"
            git diff --name-only origin/main | grep -Ev 'package-lock\.json|\.db$|\.db-wal$|\.db-shm$|\.log$|^public/dist/'
            echo "$FDELIM"
          } >> $GITHUB_OUTPUT
      - name: Check for new/deleted files
        id: diff_type
        run: |
          git fetch origin main --depth=1
          NEW_DELETED=$(git diff --diff-filter=AD --name-only origin/main)
          echo "has_new_deleted=$(test -n "$NEW_DELETED" && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Get diff for review
        id: diff
        run: |
          set -e
          git fetch origin main --depth=1
          git diff -U3 origin/main -- . ":!package-lock.json" ":!*.db" ":!*.db-wal" ":!*.db-shm" ":!*.log" ":!public/dist/" > /tmp/diff_raw.txt || true
          node -e '
            const fs = require("fs");
            const CAP = 60 * 1024;
            let raw = fs.readFileSync("/tmp/diff_raw.txt", "utf8");
            if (Buffer.byteLength(raw, "utf8") <= CAP) { fs.writeFileSync("/tmp/diff_capped.txt", raw); return; }
            let cut = Buffer.from(raw, "utf8").slice(0, CAP).toString("utf8");
            const lastHunk = cut.lastIndexOf("\ndiff --git ");
            const lastHeader = cut.lastIndexOf("\n@@ ");
            const boundary = Math.max(lastHunk, lastHeader);
            cut = boundary > 0 ? cut.slice(0, boundary) : cut;
            const omitted = Buffer.byteLength(raw, "utf8") - Buffer.byteLength(cut, "utf8");
            fs.writeFileSync("/tmp/diff_capped.txt", cut + `\n[DIFF TRUNCATED — ${omitted} bytes omitted; review only the shown hunks]`);
          '
          if [ ! -s /tmp/diff_capped.txt ]; then
            echo "[NO TEXT DIFF — report nothing, VERDICT: Approved]" > /tmp/diff_capped.txt
          fi
          echo "diff_size=$(wc -c < /tmp/diff_capped.txt) bytes"
      - name: Build review prompt
        id: prompt
        env:
          FILES: ${{ steps.changes.outputs.files }}
          HAS_NEW_DELETED: ${{ steps.diff_type.outputs.has_new_deleted }}
          DIFF_FILE: /tmp/diff_capped.txt
        run: |
          set -e
          if [ ! -f .github/prompts/code-review.md ]; then
            echo "Error: .github/prompts/code-review.md not found"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            let prompt = fs.readFileSync(".github/prompts/code-review.md", "utf8");
            
            let instruction = "REVIEW_INSTRUCTION: QUICK review - Focus on Threats + Structure + previously reported issues. Skip Functionality, AI Sloop, Coverage unless critical.";
            if (process.env.HAS_NEW_DELETED === "true") {
              instruction = "REVIEW_INSTRUCTION: Apply all 5 FACTS categories (FULL review).";
            }
            
            const diffBody = fs.existsSync(process.env.DIFF_FILE) ? fs.readFileSync(process.env.DIFF_FILE, "utf8") : "[NO TEXT DIFF — report nothing, VERDICT: Approved]";
            prompt = prompt.replace(/\{files\}/g, () => process.env.FILES || "");
            prompt = prompt.replace(/\{diff\}/g, () => diffBody);
            prompt = prompt.replace(/\{comment_source\}/g, () => "main");
            prompt = prompt.replace(/\{discussion_context\}/g, () => "");
            prompt = prompt.replace(/\{review_instruction\}/g, () => instruction);
            
            fs.writeFileSync("/tmp/final_prompt_review.md", prompt);
          '

          EOF_DELIM=$(openssl rand -hex 8)
          echo "prompt<<$EOF_DELIM" >> $GITHUB_OUTPUT
          cat /tmp/final_prompt_review.md >> $GITHUB_OUTPUT
          echo "$EOF_DELIM" >> $GITHUB_OUTPUT
      - name: Run OpenCode Review (principal)
        id: review_principal
        # Pin to reviewed commit for v1.18.31 (mutable tags are supply-chain risk)
        uses: anomalyco/opencode/github@014614d35b397775e5d397a490fc72368c894ec2
        continue-on-error: true
        env:
          ZENCODE_API_KEY: ${{ secrets.ZENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PERMISSION: '{"*":"allow"}'
        with:
          model: ${{ vars.OPENCODE_MAJOR_PRINCIPAL || 'opencode/nemotron-3-ultra-free' }}
          share: false
          use_github_token: true
          prompt: ${{ steps.prompt.outputs.prompt }}
      - name: Run OpenCode Review (fallback)
        id: review_fallback
        if: steps.review_principal.outcome == 'failure'
        # Same pin as principal; only the model input changes
        uses: anomalyco/opencode/github@014614d35b397775e5d397a490fc72368c894ec2
        env:
          ZENCODE_API_KEY: ${{ secrets.ZENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PERMISSION: '{"*":"allow"}'
          OPENCODE_MODEL_ATTEMPT: fallback
        with:
          model: ${{ vars.OPENCODE_MAJOR_FALLBACK || 'opencode/muse-spark-1.3-contributor-free' }}
          share: false
          use_github_token: true
          prompt: ${{ steps.prompt.outputs.prompt }}
      - name: Create inline review comments
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          set -e
          echo "Attempting to create inline review comments for PR $PR_NUMBER run $RUN_ID"
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number, skipping inline creation"
            exit 0
          fi
          # Fetch main comment body
          BODY=""
          for i in 1 2 3 4 5; do
            BODY=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate 2>/dev/null | jq -r --arg run "$RUN_ID" 'first(.[] | select(.user.login == "github-actions[bot]" and (.body | contains($run))) | .body) // empty')
            if [ -n "$BODY" ] && [ "$BODY" != "null" ]; then
              break
            fi
            echo "Main comment not found yet, retry $i/5..."
            sleep 4
          done
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "No main comment found, skipping inline creation"
            exit 0
          fi
          printf '%s' "$BODY" > /tmp/main_body.txt
          # Parse Open Issues details into review comments
          node -e '
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/main_body.txt", "utf8");
            const files = (process.env.FILES || "").split("\n").map((s) => s.trim()).filter(Boolean);
            const fileMap = new Map();
            for (const f of files) {
              const short = f.split("/").pop();
              if (!fileMap.has(short)) fileMap.set(short, f);
              fileMap.set(f, f);
            }
            const comments = [];
            const headerRegex = /###\s+`([^`]+)`\s*\(Line\s+(\d+).*?\)/g;
            let match;
            while ((match = headerRegex.exec(body)) !== null) {
              const rawFile = match[1].trim();
              const line = parseInt(match[2], 10);
              const start = match.index;
              const next = body.indexOf("### `", start + match[0].length);
              const section = body.slice(start, next === -1 ? undefined : next);
              const issueMatch = section.match(/-\s+\*\*Issue:\*\*\s*(.+?)(?=\n-|\n```|\n###|\n$)/s);
              const fixMatch = section.match(/-\s+\*\*Fix:\*\*\s*([\s\S]*?)(?=\n###|\n```|$)/);
              const issue = issueMatch ? issueMatch[1].trim() : "";
              const fix = fixMatch ? fixMatch[1].trim().slice(0, 800) : "";
              let path = fileMap.get(rawFile) || rawFile;
              if (!files.includes(path)) {
                const found = files.find(f => f.endsWith(rawFile));
                if (found) path = found;
              }
              if (!path || !line) continue;
              const commentBody = `**Issue:** ${issue}\n\n**Fix:** ${fix}`;
              comments.push({ path, line, body: commentBody.slice(0, 2000) });
              if (comments.length >= 8) break;
            }
            console.log(`Parsed ${comments.length} inline comments`);
            fs.writeFileSync("/tmp/inline_comments.json", JSON.stringify(comments, null, 2));
            if (comments.length > 0) {
              console.log(JSON.stringify(comments, null, 2));
            }
          '
          COUNT=$(jq length /tmp/inline_comments.json 2>/dev/null || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "No inline comments parsed, skipping review creation"
            exit 0
          fi
          echo "Filtering $COUNT comments to diff hunks..."
          git diff origin/main > /tmp/diff_full.txt || true
          node -e '
            const fs = require("fs");
            const diff = fs.readFileSync("/tmp/diff_full.txt", "utf8");
            const comments = JSON.parse(fs.readFileSync("/tmp/inline_comments.json", "utf8"));
            const hunks = new Map();
            let current = null;
            for (const line of diff.split("\n")) {
              if (line.startsWith("+++ b/")) {
                current = line.slice(6);
                if (!hunks.has(current)) hunks.set(current, []);
              } else if (line.startsWith("@@ ") && current) {
                const m = line.match(/\+(\d+)(?:,(\d+))?/);
                if (m) {
                  const s = parseInt(m[1], 10);
                  const n = m[2] ? parseInt(m[2], 10) : 1;
                  hunks.get(current).push([s, s + n]);
                }
              }
            }
            const filtered = comments.filter(c => {
              const ranges = hunks.get(c.path);
              if (!ranges || ranges.length === 0) return false;
              return ranges.some(([a,b]) => c.line >= a && c.line < b);
            });
            console.log(`Filtered ${comments.length} -> ${filtered.length} in diff`);
            if (filtered.length === 0 && comments.length > 0) {
              console.log("Hunks sample:", JSON.stringify([...hunks.entries()].slice(0,3)).slice(0,800));
              console.log("Comments:", JSON.stringify(comments,null,2).slice(0,1000));
            }
            fs.writeFileSync("/tmp/inline_comments.json", JSON.stringify(filtered, null, 2));
          '
          COUNT=$(jq length /tmp/inline_comments.json 2>/dev/null || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "No inline comments in diff, skipping review creation"
            exit 0
          fi
          echo "Deduplicating against already reported inline..."
          gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate > /tmp/existing_inline.json || true
          node -e '
            const fs=require("fs");
            const existing=JSON.parse(fs.readFileSync("/tmp/existing_inline.json","utf8")).filter(c=>c.user.login=="github-actions[bot]");
            const comments=JSON.parse(fs.readFileSync("/tmp/inline_comments.json","utf8"));
            const seen=new Set(existing.map(c=>`${c.path}:${c.line}`));
            const deduped=comments.filter(c=> !seen.has(`${c.path}:${c.line}`));
            console.log(`Deduped ${comments.length} -> ${deduped.length} (skipped ${comments.length - deduped.length} already reported)`);
            if (deduped.length===0 && comments.length>0) {
              console.log("Existing at same lines:", [...seen].slice(0,5));
            }
            fs.writeFileSync("/tmp/inline_comments.json", JSON.stringify(deduped,null,2));
          '
          COUNT=$(jq length /tmp/inline_comments.json 2>/dev/null || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "No new inline to post (already reported), skipping"
            exit 0
          fi
          echo "Creating PR review with $COUNT inline comments"
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          COMMIT_MSG=$(git log -1 --pretty=%s $HEAD_SHA 2>/dev/null | head -c 80)
          echo "HEAD_SHA=$HEAD_SHA"
          echo "COMMIT_MSG=$COMMIT_MSG"
          HEAD_SHA=$HEAD_SHA COMMIT_MSG="$COMMIT_MSG" node -e '
            const fs = require("fs");
            const comments = JSON.parse(fs.readFileSync("/tmp/inline_comments.json", "utf8"));
            const short = process.env.HEAD_SHA.slice(0,7);
            const msg = process.env.COMMIT_MSG || "";
            const body = `Inline findings from commit ${short} (${msg}). See main conversation for full VERDICT and stats.`;
            const payload = { commit_id: process.env.HEAD_SHA, event: "COMMENT", body, comments };
            fs.writeFileSync("/tmp/review_payload.json", JSON.stringify(payload));
          '
          echo "Payload preview:"
          cat /tmp/review_payload.json | head -n 60
          if gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --method POST --input /tmp/review_payload.json 2>&1 | tee /tmp/review_resp.txt; then
            echo "✓ Created inline review"
            cat /tmp/review_resp.txt | head -n 20
          else
            echo "⚠ Failed to create inline review"
            cat /tmp/review_resp.txt | head -n 80
            cat /tmp/review_payload.json | head -n 100
          fi
      # Artifacts are manual-recovery + same-run /tmp reuse; cross-run restore via run-page download (no auto-download).
      - name: Save review state artifact
        if: always()
        env:
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          printf '%s' "$FILES" > /tmp/changed_files.txt || true
      # Artifacts are manual-recovery + same-run /tmp reuse; cross-run restore via run-page download (no auto-download).
      - name: Upload review state artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 (same pin as coverage upload)
        with:
          name: review-state-${{ github.run_id }}
          path: |
            /tmp/main_body.txt
            /tmp/inline_comments.json
            /tmp/final_prompt_review.md
            /tmp/changed_files.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upsert general comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "Upsert general comment for run $RUN_ID (edit old, keep 1)"
          NEW_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate 2>/dev/null | jq -r --arg run "$RUN_ID" 'first(.[] | select(.user.login == "github-actions[bot]" and (.body | contains($run))) | .id) // empty')
          if [ -z "$NEW_ID" ] || [ "$NEW_ID" = "null" ]; then
            echo "No new general found for $RUN_ID"
            exit 0
          fi
          echo "New general ID: $NEW_ID"
          NEW_BODY=$(gh api "repos/$REPO/issues/comments/$NEW_ID" --jq .body)
          printf '%s' "$NEW_BODY" > /tmp/new_body.txt
          # Smart A: oldest *visible* (not minimized/hidden) VERDICT, if none visible keep NEW as new stable
          OLD_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate 2>/dev/null | jq -r --arg new "$NEW_ID" '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("VERDICT:")) and (.minimized == null) and (.id | tostring) != $new)] | sort_by(.created_at) | .[0].id // empty')
          if [ -z "$OLD_ID" ] || [ "$OLD_ID" = "null" ]; then
            echo "No visible older general to upsert, keeping $NEW_ID as is (will become new stable)"
            exit 0
          fi
          echo "Old general ID to update: $OLD_ID"
          node -e '
            const fs=require("fs");
            const body=fs.readFileSync("/tmp/new_body.txt","utf8");
            fs.writeFileSync("/tmp/upsert_payload.json", JSON.stringify({body}));
          '
          if gh api "repos/$REPO/issues/comments/$OLD_ID" --method PATCH --input /tmp/upsert_payload.json 2>&1 | head -n 20; then
            echo "✓ Updated old general $OLD_ID"
            gh api "repos/$REPO/issues/comments/$NEW_ID" --method DELETE 2>&1 | head -n 20 && echo "✓ Deleted duplicate new $NEW_ID (no new dupe, kept visible $OLD_ID)" || echo "⚠ Failed to delete duplicate $NEW_ID"
          else
            echo "⚠ Failed to update old $OLD_ID, keeping new"
          fi
          echo "Upsert done, kept $OLD_ID (existing dupes this PR left as is)"
