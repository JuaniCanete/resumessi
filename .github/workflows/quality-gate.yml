name: Quality Gate & Code Review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-gate:
    name: Security & Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.22.0'

      - name: Run Quality Gate Script
        run: npm run quality-gate
        continue-on-error: false

      - name: Comment on PR if Quality Gate Fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Quality Gate Failed**\n\nThe security and compliance check detected issues:\n- Forbidden files (secrets, PII, .env, etc.)\n- Hardcoded API keys or tokens\n- Personal data (resume files, contact info)\n- Suspicious patterns\n\nPlease review and remove these before re-pushing.'
            })

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

  lint:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format -- --check

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: cross-env NODE_ENV=test npm run test:coverage

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  code-review:
    name: Code Review Suggestions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41

      - name: Analyze changes for review points
        if: steps.changed-files.outputs.all_changed_files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changedFiles = `${{ steps.changed-files.outputs.all_changed_files }}`.split(' ');

            let reviewItems = [];

            // Check for large diffs
            for (const file of changedFiles) {
              try {
                const stats = require('child_process').execSync(`git diff HEAD~1 HEAD --stat -- ${file}`, {encoding: 'utf8'});
                if (stats.includes('+') && stats.split('+').length > 50) {
                  reviewItems.push(`📝 Large file changes in \`${file}\` - consider splitting into smaller commits`);
                }
              } catch (e) {
                // Skip if git diff fails
              }
            }

            // Check for common patterns
            const tsFiles = changedFiles.filter(f => f.endsWith('.ts') || f.endsWith('.tsx'));
            for (const file of tsFiles) {
              try {
                const content = fs.readFileSync(file, 'utf8');
                if (content.match(/console\.(log|warn|error)\(/)) {
                  reviewItems.push(`🔍 Debug console statements found in \`${file}\` - consider removing before merge`);
                }
                if (content.match(/any\b/)) {
                  reviewItems.push(`⚠️ TypeScript \`any\` type used in \`${file}\` - consider adding proper types`);
                }
              } catch (e) {
                // Skip if file read fails
              }
            }

            if (reviewItems.length > 0) {
              const body = '🤖 **Automated Code Review Suggestions**\n\n' + 
                           reviewItems.map(item => `- ${item}`).join('\n') +
                           '\n\n_These are suggestions only - feel free to dismiss if not applicable._';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
