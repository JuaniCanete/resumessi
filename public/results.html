<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resumessi — Job Scraper Results</title>

    <!-- Google Fonts: Comfortaa & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #0a0a0a;
            --secondary: #0a0a0a;
            --accent: #2563eb;
            --text: #171717;
            --text-light: #404040;
            --bg-badge: #f1f5f9;
            --success: #0ea5e9;
            --whitetext: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d0f12;
            color: var(--whitetext);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: #161920;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 24px 30px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .title {
            font-family: 'Comfortaa', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .source-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .source-badge.linkedin {
            background: rgba(10, 102, 194, 0.25);
            color: #70b5f9;
            border: 1px solid rgba(10, 102, 194, 0.5);
        }

        .source-badge.google {
            background: rgba(234, 67, 53, 0.2);
            color: #f87171;
            border: 1px solid rgba(234, 67, 53, 0.4);
        }

        .meta-row {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #94a3b8;
            flex-wrap: wrap;
        }

        .meta-item span {
            color: #e2e8f0;
            font-weight: 600;
        }

        .summary-card {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .summary-title {
            font-family: 'Comfortaa', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .summary-text {
            font-size: 13.5px;
            line-height: 1.6;
            color: #e2e8f0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .summary-text h1,
        .summary-text h2,
        .summary-text h3,
        .summary-text h4 {
            font-family: 'Comfortaa', sans-serif;
            color: #fff;
            margin: 12px 0 8px 0;
            font-weight: 700;
        }

        .summary-text h1 { font-size: 16px; }
        .summary-text h2 { font-size: 15px; }
        .summary-text h3 { font-size: 14px; }
        .summary-text h4 { font-size: 13px; }

        .summary-text p {
            margin: 8px 0;
        }

        .summary-text ul,
        .summary-text ol {
            margin: 8px 0 8px 20px;
            padding-left: 20px;
        }

        .summary-text li {
            margin: 4px 0;
        }

        .summary-text strong {
            color: #60a5fa;
            font-weight: 700;
        }

        .summary-text em {
            color: #cbd5e1;
            font-style: italic;
        }

        .summary-text code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12.5px;
        }

        .summary-text a {
            color: #60a5fa;
            text-decoration: none;
        }

        .summary-text a:hover {
            text-decoration: underline;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .result-card {
            background: #161920;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.15s, border-color 0.15s;
            overflow: hidden;
        }

        .result-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .result-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .result-title:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .result-snippet {
            font-size: 13.5px;
            color: #cbd5e1;
            line-height: 1.55;
            margin-bottom: 12px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .result-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
            gap: 12px;
            flex-wrap: wrap;
        }

        .result-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            font-size: 12.5px;
        }

        .result-link-btn:hover {
            text-decoration: underline;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 28px;
            padding: 16px 20px;
            background: #161920;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .page-btn {
            padding: 8px 18px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-family: 'Comfortaa', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .page-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .page-btn:not(:disabled):hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .page-info {
            font-size: 13px;
            color: #94a3b8;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: #161920;
            border-radius: 14px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .no-results h3 {
            font-family: 'Comfortaa', sans-serif;
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <div class="title">
                    🔎 resumessi Job Scraper Results
                </div>
                <span id="source-badge" class="source-badge linkedin">LinkedIn</span>
            </div>
            <div class="meta-row">
                <div class="meta-item">Scanned: <span id="meta-timestamp">Loading...</span></div>
                <div class="meta-item">Total Findings: <span id="meta-total">0</span></div>
                <div class="meta-item">Query: <span id="meta-query">—</span></div>
            </div>
        </div>

        <!-- AI Summary Card (if present) -->
        <div id="summary-card" class="summary-card" style="display: none;">
            <div class="summary-title">✨ AI Overview & Relevance Summary</div>
            <div id="summary-text" class="summary-text"></div>
        </div>

        <!-- Results List -->
        <div id="results-list" class="results-list"></div>

        <!-- No Results Empty State -->
        <div id="no-results" class="no-results" style="display: none;">
            <h3>No job listings found</h3>
            <p style="font-size: 13px; color: #64748b;">Try adjusting your query builder keywords or targets and run the scraper again.</p>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination" style="display: none;">
            <button id="btn-prev-page" class="page-btn" onclick="prevPage()">◀ Previous</button>
            <span id="page-info" class="page-info">Page 1 of 1</span>
            <button id="btn-next-page" class="page-btn" onclick="nextPage()">Next ▶</button>
        </div>
    </div>

    <script src="/public/dist/results-app.js"></script>

</body>

</html>
